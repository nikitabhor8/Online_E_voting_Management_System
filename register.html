<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Register</title>
</head>

<body>

<section class="register-section">

    <div class="form-box">

        <h1>Register</h1>

        <div th:if="${session.fail}">
            <h3 th:text="${session.fail}" style="color:red"></h3>
            <th:block th:text="${#session.removeAttribute('fail')}"></th:block>
        </div>

        <div th:if="${session.msg}">
            <h3 th:text="${session.msg}" style="color:green"></h3>
            <th:block th:text="${#session.removeAttribute('msg')}"></th:block>
        </div>

        <form th:action="@{/createuser}" method="post">

            <input type="text" name="name"
                placeholder="Enter Your User Name" required>

            <input type="password" name="password"
                placeholder="Enter Your Password" required>

            <input type="email" name="email"
                placeholder="Enter Your Email Id" required>

            <input type="number" name="phone"
                placeholder="Enter Your Phone No" required>

            <input type="submit" value="Register" class="btn-register">

        </form>

    </div>

</section>

</body>
</html>
